<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Security Details</title>
    <link rel="stylesheet" href="static/css/base.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <section class="container">
        <div class="row">
            <div class="col-sm-8">
                <h3>CRUD Operations</h3>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-8">
                <a href="{% url 'AddEmployee' %}" class="btn btn-primary float-end">Add</a>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-8">
                <table class="table table-dark table-hover">
                    <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">thumbnails</th>
      <th scope="col">price</th>
      <th scope="col">qty</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody>
  {% for stud in studata %}
    <tr>
      <th scope="row">{{stud.id}}</th>
      <td>{{stud.thumbnails}}</td>
      <td>{{stud.price}}</td>
      <td>{{stud.qty}}</td>
      <td class="aline-inline">
          <table>
              <tr>
                  <td>
                      <a href="{% url 'EditEmployee' stud.id %}" class="btn btn-info btn-sm">Edit</a>
                  </td>
              </tr>
          </table>
          <form action="{% url 'DeleteEmployee' %}" method="post">
              {% csrf_token  %}
              <input type="hidden" name="id" value={{stud.id}}>
              <input type="submit" value="Delete" class="btn btn-danger btn-sm">
          </form>
      </td>
    </tr>
{% endfor %}
  </tbody>
                </table>
            </div>
        </div>
    </section>
</body>
</html>
